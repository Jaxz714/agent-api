[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-api"
version = "0.1.0"
description = "Turn any AI agent into an API service — one config file, instant API with auth, rate limiting, logging, and docs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jaxz714" },
]
dependencies = [
    "click>=8.0",
    "httpx>=0.24",
    "pyyaml>=6.0",
    "rich>=13.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.scripts]
agentapi = "agentapi.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["agentapi"]
